<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <title>Qwen 2.5 PWA</title>
  <style>
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; margin: 0; padding: 1rem; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #38bdf8; }
    #status { font-size: 0.9rem; color: #94a3b8; margin: 0.5rem 0; }
    #chat { background: #1e293b; border-radius: 8px; padding: 1rem; height: 300px; overflow-y: auto; margin-bottom: 1rem; white-space: pre-wrap; }
    .input-row { display: flex; gap: 0.5rem; }
    #prompt { flex: 1; padding: 0.75rem; border-radius: 8px; border: none; background: #334155; color: white; }
    button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Qwen 2.5 (1.5B)</h1>
    <div id="status">Загрузка модели...</div>
    <div id="chat"></div>
    <div class="input-row">
      <input id="prompt" type="text" placeholder="Введите сообщение..." disabled />
      <button id="send" disabled>Отправить</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
